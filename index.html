<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문맥 속 한 글자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202b;
  --paper:#f5f0e4;
  --paper-deep:#e8dfc9;
  --vermilion:#c9452f;
  --indigo:#2f5d7c;
  --gold:#d9a441;
  --green:#3f7a4d;
  --line:rgba(22,32,43,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Zen Maru Gothic','Gowun Dodum',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.screen{display:none;height:100vh}
.screen.on{display:flex}

/* ---------- setup ---------- */
#setup{flex-direction:column;align-items:center;justify-content:center;gap:2.4rem;padding:2rem}
.brand{text-align:center;line-height:1.15}
.brand .ja{font-size:clamp(2rem,5.6vw,3.8rem);font-weight:900;letter-spacing:.02em}
.brand .ja span{color:var(--vermilion)}
.brand .ko{margin-top:.6rem;font-size:clamp(.95rem,1.6vw,1.25rem);color:rgba(22,32,43,.6)}
.teamform{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center}
.teamfield{display:flex;flex-direction:column;gap:.5rem}
.teamfield label{font-size:.9rem;color:rgba(22,32,43,.55)}
.teamfield input{
  font-family:inherit;font-size:1.5rem;font-weight:700;padding:.7rem 1.1rem;width:min(19rem,78vw);
  background:#fff;border:2px solid var(--line);border-radius:.7rem;color:var(--ink);
}
.teamfield input:focus{outline:none;border-color:var(--indigo)}
#f1:focus{border-color:var(--vermilion)}
.start{
  background:var(--ink);color:var(--paper);font-size:1.35rem;font-weight:700;
  padding:1rem 3.4rem;border-radius:999px;letter-spacing:.04em;
}
.start:hover{background:var(--vermilion)}
.hint-line{font-size:.9rem;color:rgba(22,32,43,.5);text-align:center;line-height:1.9}
kbd{
  font-family:inherit;font-weight:700;background:var(--paper-deep);
  border-radius:.35rem;padding:.12rem .5rem;font-size:.85em;
}

/* ---------- board ---------- */
#board{flex-direction:column;padding:1.6vh 2vw}
.scores{display:flex;gap:1.2vw;flex-shrink:0}
.team{
  flex:1;background:#fff;border-radius:1rem;padding:1.1vh 1.6vw;
  display:flex;align-items:center;justify-content:space-between;
  border:3px solid transparent;transition:transform .12s;
}
.team.a{border-color:var(--vermilion)}
.team.b{border-color:var(--indigo)}
.team.bump{transform:scale(1.04)}
.team .nm{font-size:clamp(1rem,2.1vw,1.9rem);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .sc{font-size:clamp(1.8rem,4.4vw,3.6rem);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.team.a .sc{color:var(--vermilion)}
.team.b .sc{color:var(--indigo)}

.meta{display:flex;align-items:center;justify-content:space-between;padding:1.2vh .3vw .8vh;flex-shrink:0}
.lvl{font-size:clamp(.85rem,1.6vw,1.15rem);font-weight:900;padding:.3rem 1.1rem;border-radius:999px;background:var(--paper-deep)}
.lvl[data-l="N5"]{background:#dbead9;color:#33612c}
.lvl[data-l="N4"]{background:#dceaf0;color:#2a6373}
.lvl[data-l="N3"]{background:#dee6ef;color:#2f5d7c}
.lvl[data-l="N2"]{background:#f3e6d3;color:#8a5a1f}
.lvl[data-l="N1"]{background:#f2dcd7;color:#a3341f}
.count{font-size:clamp(.8rem,1.5vw,1.1rem);color:rgba(22,32,43,.5);font-variant-numeric:tabular-nums}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.card{
  width:100%;max-width:60rem;background:#fff;border-radius:1.2rem;
  padding:4vh 4vw;display:flex;flex-direction:column;gap:2.6vh;
}
.sentence{
  font-family:'Nanum Myeongjo',serif;
  font-size:clamp(1.4rem,3.4vw,2.5rem);
  line-height:1.9;text-align:center;color:var(--ink);
}
.sentence .blank{
  display:inline-block;min-width:2.6em;border-bottom:3px solid var(--gold);
  color:var(--gold);font-weight:700;text-align:center;
}
.sentence ruby, .opt ruby{ruby-position:over}
.sentence rt, .opt rt{
  font-size:.45em;color:var(--gold);font-weight:700;letter-spacing:0;
}
.opt.wrong rt{color:rgba(22,32,43,.4)}
.meaning{
  font-size:clamp(.95rem,1.8vw,1.25rem);color:rgba(22,32,43,.55);
  text-align:center;line-height:1.7;
}
.options{
  display:grid;grid-template-columns:repeat(2,1fr);gap:1rem 1.4rem;
}
.opt{
  background:var(--paper);border-radius:.9rem;padding:1.6vh 1.6vw;
  font-size:clamp(1.15rem,2.4vw,1.75rem);font-weight:700;text-align:center;
  border:3px solid transparent;transition:all .15s;display:flex;align-items:center;gap:.7rem;
}
.opt .num{font-size:.6em;color:rgba(22,32,43,.4);font-weight:900}
.opt.correct{background:#e2f0e4;border-color:var(--green);color:#2b5c37}
.opt.wrong{opacity:.4}
.note{
  font-size:clamp(.9rem,1.7vw,1.15rem);color:rgba(22,32,43,.6);
  text-align:center;line-height:1.7;padding-top:.4vh;border-top:1px solid var(--line);
  opacity:0;transition:opacity .25s;
}
.note.show{opacity:1}

.bar{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:1.4vw;
  padding-top:1.2vh;font-size:clamp(.7rem,1.25vw,.95rem);color:rgba(22,32,43,.45);flex-wrap:wrap;
}
.bar b{font-weight:700;color:rgba(22,32,43,.7)}

/* ---------- picker ---------- */
#picker{
  position:fixed;inset:0;background:rgba(22,32,43,.55);z-index:50;
  display:none;align-items:center;justify-content:center;padding:4vh 3vw;
}
#picker.on{display:flex}
.sheet{
  background:var(--paper);border-radius:1.4rem;width:min(60rem,94vw);max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet header{display:flex;gap:.5rem;padding:1.2rem 1.4rem .9rem;align-items:center;flex-wrap:wrap}
.tab{
  font-size:1rem;font-weight:700;padding:.5rem 1.2rem;border-radius:999px;
  background:var(--paper-deep);color:rgba(22,32,43,.55);
}
.tab.on{background:var(--ink);color:var(--paper)}
.sheet header .x{margin-left:auto;font-size:1.7rem;line-height:1;color:rgba(22,32,43,.4);padding:0 .5rem}
.grid{
  overflow-y:auto;padding:0 1.4rem 1.4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.7rem;
}
.cell{
  background:#fff;border-radius:.8rem;padding:.85rem 1rem;text-align:left;
  border:2px solid transparent;
}
.cell:hover{border-color:var(--indigo)}
.cell.done{opacity:.42}
.cell .n{font-size:.75rem;color:rgba(22,32,43,.4);font-weight:700}
.cell .w{font-size:1.1rem;font-weight:700;margin-top:.15rem}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:rgba(22,32,43,.4);font-size:1rem;line-height:1.9}
</style>
</head>
<body>

<section id="setup" class="screen on">
  <div class="brand">
    <div class="ja">문맥 속 <span>한 글자</span></div>
    <div class="ko">빈칸에 알맞은 단어 찾기 · JLPT 스타일 · 5주년 파티</div>
  </div>
  <div class="teamform">
    <div class="teamfield"><label for="f1">1팀 이름</label><input id="f1" value="さくら" maxlength="14"></div>
    <div class="teamfield"><label for="f2">2팀 이름</label><input id="f2" value="ふじ" maxlength="14"></div>
  </div>
  <button class="start" id="go">시작하기</button>
  <p class="hint-line">
    <kbd>P</kbd> 문제 고르기 · <kbd>Space</kbd>/<kbd>Enter</kbd> 정답 공개<br>
    <kbd>1</kbd> <kbd>2</kbd> 점수 +1 · <kbd>Shift</kbd>+<kbd>1</kbd>/<kbd>2</kbd> 점수 −1 · <kbd>←</kbd>/<kbd>→</kbd> 이전·다음 문제
  </p>
</section>

<section id="board" class="screen">
  <div class="scores">
    <div class="team a" id="ta"><span class="nm" id="n1">さくら</span><span class="sc" id="s1">0</span></div>
    <div class="team b" id="tb"><span class="nm" id="n2">ふじ</span><span class="sc" id="s2">0</span></div>
  </div>
  <div class="meta">
    <span class="lvl" id="lvl" data-l="N5">N5</span>
    <span class="count" id="cnt">1 / 1</span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bar">
    <span><b>Space</b>/<b>Enter</b> 정답 공개</span>
    <span><b>1</b>/<b>2</b> 득점 · <b>Shift+1</b>/<b>2</b> 감점</span>
    <span><b>←</b> 이전 · <b>→</b> 다음 · <b>P</b> 문제표</span>
  </div>
</section>

<div id="picker">
  <div class="sheet">
    <header>
      <button class="tab on" data-t="N5">N5</button>
      <button class="tab" data-t="N4">N4</button>
      <button class="tab" data-t="N3">N3</button>
      <button class="tab" data-t="N2">N2</button>
      <button class="tab" data-t="N1">N1</button>
      <button class="x" id="close" aria-label="닫기">&times;</button>
    </header>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script src="jlpt-questions.js"></script>
<script>
const $ = id => document.getElementById(id);
let cur = null, open = false, tab = 'N5';
const score = [0, 0];
const done = new Set();
let history = [];
let histPos = -1;
const NUM = ['①', '②', '③', '④'];

function ruby(opt){
  return '<ruby>' + opt.text + '<rt>' + opt.reading + '</rt></ruby>';
}

function render(){
  if(!cur) return;
  $('lvl').textContent = cur.level;
  $('lvl').dataset.l = cur.level;
  const pool = QUESTIONS.filter(q => q.level === cur.level);
  $('cnt').textContent = (pool.indexOf(cur) + 1) + ' / ' + pool.length;

  const blankHtml = open ? ruby(cur.options[cur.answer]) : '＿＿';
  const sentenceHtml = cur.sentence.replace('＿＿', '<span class="blank">' + blankHtml + '</span>');

  $('stage').innerHTML =
    '<div class="card">' +
      '<div class="sentence">' + sentenceHtml + '</div>' +
      '<div class="meaning">' + (cur.meaning || '') + '</div>' +
      '<div class="options">' +
        cur.options.map((o, i) =>
          '<div class="opt' + (open ? (i === cur.answer ? ' correct' : ' wrong') : '') + '">' +
            '<span class="num">' + NUM[i] + '</span>' + (open && i === cur.answer ? ruby(o) : o.text) +
          '</div>'
        ).join('') +
      '</div>' +
      '<div class="note' + (open ? ' show' : '') + '">' + (open ? (cur.note || '') : '') + '</div>' +
    '</div>';

  if(open) done.add(cur.id);
}

function load(q){ cur = q; open = false; render(); }

function visit(q){
  history = history.slice(0, histPos + 1);
  history.push(q);
  histPos = history.length - 1;
  load(q);
}

function prev(){
  if(histPos > 0){
    histPos--;
    load(history[histPos]);
  }
}

function bump(i, d){
  score[i] = Math.max(0, score[i] + d);
  $('s' + (i + 1)).textContent = score[i];
  const t = $(i === 0 ? 'ta' : 'tb');
  t.classList.add('bump');
  setTimeout(() => t.classList.remove('bump'), 130);
}

function next(){
  const pool = QUESTIONS.filter(q => q.level === cur.level);
  const rest = pool.filter(q => !done.has(q.id));
  if(rest.length) visit(rest[0]);
  else openPicker();
}

function grid(){
  const pool = QUESTIONS.filter(q => q.level === tab);
  $('grid').innerHTML = pool.length ? pool.map((q, i) =>
    '<button class="cell' + (done.has(q.id) ? ' done' : '') + '" data-id="' + q.id + '">' +
    '<span class="n">' + (i + 1) + '</span>' +
    '<div class="w">문제 ' + (i + 1) + '</div></button>'
  ).join('') : '<div class="empty">이 등급에 등록된 문제가 없어요<br>jlpt-questions.js에 추가해주세요</div>';
}

function openPicker(){ grid(); $('picker').classList.add('on'); }

$('go').onclick = () => {
  $('n1').textContent = $('f1').value.trim() || '1팀';
  $('n2').textContent = $('f2').value.trim() || '2팀';
  $('setup').classList.remove('on');
  $('board').classList.add('on');
  if(QUESTIONS.length) visit(QUESTIONS[0]);
  openPicker();
};

$('close').onclick = () => $('picker').classList.remove('on');

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  tab = b.dataset.t;
  grid();
});

$('grid').onclick = e => {
  const c = e.target.closest('.cell');
  if(!c) return;
  $('picker').classList.remove('on');
  visit(QUESTIONS.find(q => q.id === c.dataset.id));
};

document.addEventListener('keydown', e => {
  if(!$('board').classList.contains('on')) return;
  if(e.target.tagName === 'INPUT') return;
  const k = e.key;

  if(k === 'p' || k === 'P' || k === 'ㅔ'){ e.preventDefault(); $('picker').classList.contains('on') ? $('picker').classList.remove('on') : openPicker(); return; }
  if($('picker').classList.contains('on')){ if(k === 'Escape') $('picker').classList.remove('on'); return; }

  if(k === ' ' || k === 'Enter'){ e.preventDefault(); if(!open){ open = true; render(); } return; }
  if(k === 'ArrowRight'){ e.preventDefault(); next(); return; }
  if(k === 'ArrowLeft'){ e.preventDefault(); prev(); return; }
  if(k === '1'){ bump(0, 1); return; }
  if(k === '2'){ bump(1, 1); return; }
  if(k === '!'){ bump(0, -1); return; }
  if(k === '@'){ bump(1, -1); return; }
});
</script>
</body>
</html>
